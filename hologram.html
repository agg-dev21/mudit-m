<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hologram lab — Mudit Manocha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
  :root{--paper:#0e0e0f;--ink:#ecebe6;--ink-2:#a8a69f;--ink-3:#6e6c67;--line:rgba(236,235,230,.12);--signal:#ff5a1f}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--paper);color:var(--ink);font-family:"Archivo",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0}
  .ui{position:fixed;left:0;right:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px clamp(16px,4vw,56px);pointer-events:none}
  .ui > *{pointer-events:auto}
  .top{top:0}
  .bottom{bottom:0;align-items:flex-end}
  .label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
  a{color:var(--ink-2);text-decoration:none}
  a:hover{color:var(--ink)}
  .tabs{display:flex;flex-wrap:wrap;gap:6px}
  .tabs button,.file{
    font:inherit;font-size:14px;color:var(--ink-2);background:rgba(255,255,255,.04);
    border:1px solid var(--line);border-radius:999px;padding:9px 16px;cursor:pointer;
    transition:color .3s,border-color .3s,background .3s
  }
  .tabs button:hover,.file:hover{color:var(--ink)}
  .tabs button.on{color:#111;background:var(--ink);border-color:var(--ink)}
  .file input{display:none}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  #explode[hidden]{display:none}
  #explode[aria-pressed="true"]{color:#111;background:var(--ink);border-color:var(--ink)}
  h1{font-weight:600;font-variation-settings:"wdth" 108,"wght" 600;font-size:clamp(28px,4vw,56px);letter-spacing:-.04em;line-height:1}
  .note{max-width:30em;margin-top:10px;color:var(--ink-2);font-size:15px;line-height:1.5}
  .err{color:var(--signal)}
  @media (max-width:760px){ .ui{flex-direction:column;align-items:flex-start} .bottom{align-items:flex-start} }
</style>
</head>
<body>
<div id="stage"></div>

<div class="ui top">
  <a class="label" href="index.html">← Back to the site</a>
  <div class="tabs" id="tabs"></div>
</div>

<div class="ui bottom">
  <div>
    <p class="label" id="kind">Hologram · from the render</p>
    <h1 id="title"></h1>
    <p class="note" id="note">Drag to turn it.</p>
  </div>
  <div class="actions">
    <button type="button" class="file" id="explode" aria-pressed="false">Explode</button>
    <label class="file">Load a 3D file (.stl / .glb)<input type="file" id="file" accept=".stl,.glb,.gltf"></label>
  </div>
</div>

<script type="module">
  import { mountHologram } from './assets/hologram.js?v=22';

  /* real Rhino models where the client sent them; Module has only renders */
  const products = [
    { name: 'Cochlear Implant',   model: 'assets/models/cochlear.glb' },
    { name: 'Stove · Concept 1',  model: 'assets/models/stove-concept-1.glb' },
    { name: 'Stove · Concept 2',  model: 'assets/models/stove-concept-2.glb' },
    { name: 'Aerion One',         model: 'assets/models/aerion-one.glb' },
    { name: 'Module',             img: 'assets/holo/chair.png' }
  ];
  const holo = mountHologram(document.getElementById('stage'), { model: products[0].model });
  const ex = document.getElementById('explode');
  const setEx = on => { ex.setAttribute('aria-pressed', String(on)); holo.setExplode(on ? 1 : 0); };
  ex.addEventListener('click', () => setEx(ex.getAttribute('aria-pressed') !== 'true'));
  const show = async p => {
    setEx(false);
    if (p.model) { await holo.showModel(p.model, 'glb'); ex.hidden = holo.partCount < 2; }
    else { await holo.showImage(p.img); ex.hidden = true; }
  };
  const kindOf = p => p.model ? 'Real 3D model from Rhino' : 'Hologram · from the render';
  const noteOf = p => p.model ? 'Drag any way to turn it. Double-click resets. Explode pulls it apart.' : 'Drag to turn it.';
  holo.ready.then(() => { ex.hidden = holo.partCount < 2; });
  window.__holo = holo;                                   /* handy for testing */
  const tabs = document.getElementById('tabs');
  const set = (title, kind, note) => {
    document.getElementById('title').textContent = title;
    document.getElementById('kind').textContent = kind;
    document.getElementById('note').textContent = note;
    document.getElementById('note').classList.remove('err');
  };

  tabs.innerHTML = products.map((p, i) => `<button data-i="${i}"${i ? '' : ' class="on"'}>${p.name}</button>`).join('');
  set(products[0].name, kindOf(products[0]), noteOf(products[0]));
  tabs.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    tabs.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    const p = products[+b.dataset.i];
    set(p.name, kindOf(p), noteOf(p));
    show(p);
  });

  /* drop a real model in — it is read locally, nothing is uploaded */
  document.getElementById('file').addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    const url = URL.createObjectURL(f);
    tabs.querySelectorAll('button').forEach(x => x.classList.remove('on'));
    set(f.name.replace(/\.[^.]+$/, ''), 'Hologram · real 3D model', 'Drag to turn it all the way round.');
    try { setEx(false); await holo.showModel(url, f.name.split('.').pop()); ex.hidden = holo.partCount < 2; }
    catch (err) {
      document.getElementById('note').textContent = 'That file could not be read. STL or GLB files work best.';
      document.getElementById('note').classList.add('err');
    }
  });
</script>
</body>
</html>
