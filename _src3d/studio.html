<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>studio views</title>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script></head><body style="margin:0">
<script type="module">
/* Internal tool: a studio view of one of Mudit's Rhino models, for models
   he never rendered. Geometry and object colours are his own file; nothing
   is added or re-coloured, only light, a plain backdrop and a floor shadow.
   These are NOT KeyShot renders and the site labels them as such.
   window.studio(url, { yaw, tilt, back, w, h }) resolves to a JPEG data URL. */
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.VSMShadowMap;
document.body.appendChild(renderer.domElement);
const env = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), .04).texture;

/* the backdrop: a soft radial falloff, light centre to darker edges */
const backdrop = (w, h) => {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'), r = g.createRadialGradient(w * .5, h * .55, 0, w * .5, h * .55, Math.hypot(w, h) * .6);
  r.addColorStop(0, '#f1efeb'); r.addColorStop(1, '#bdbab4');
  g.fillStyle = r; g.fillRect(0, 0, w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
};

window.studio = (url, o = {}) => new Promise((res, rej) => new GLTFLoader().load(url, g => {
  const { yaw = -.7, tilt = .45, back = 1, w = 1800, h = 1200, fov = 26 } = o;
  renderer.setSize(w, h);
  const scene = new THREE.Scene(); scene.background = backdrop(w, h); scene.environment = env;
  const model = g.scene;
  model.traverse(m => {
    if (m.isMesh) {
      const c = m.material?.color ? m.material.color.clone() : new THREE.Color(0xbbbbbb);
      m.material = new THREE.MeshPhysicalMaterial({ color: c, roughness: .42, metalness: 0, clearcoat: .25, clearcoatRoughness: .4, side: THREE.DoubleSide, envMapIntensity: .9 });
      m.castShadow = m.receiveShadow = true;
    } else if (m.isLine) m.visible = false;   /* construction curves stay in Rhino */
  });
  model.rotation.y = yaw; scene.add(model); model.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(model), size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  const R = size.length() / 2;
  /* key light from upper left, casting the floor shadow */
  const key = new THREE.DirectionalLight(0xffffff, 1.6);
  key.position.set(c.x - R * 2, c.y + R * 4, c.z + R * 2); key.target.position.copy(c);
  key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 14; key.shadow.blurSamples = 20; key.shadow.bias = -.0004;
  const sc = key.shadow.camera; sc.left = sc.bottom = -R * 1.6; sc.right = sc.top = R * 1.6; sc.near = R * .5; sc.far = R * 10;
  scene.add(key, key.target);
  const rim = new THREE.DirectionalLight(0xffffff, .5); rim.position.set(c.x + R * 3, c.y + R * 1.5, c.z - R * 3); scene.add(rim);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(R * 40, R * 40), new THREE.ShadowMaterial({ opacity: .22 }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = box.min.y - R * .002; floor.receiveShadow = true; scene.add(floor);
  const cam = new THREE.PerspectiveCamera(fov, w / h, R / 100, R * 50);
  const dist = R / Math.sin(THREE.MathUtils.degToRad(fov / 2)) * .62 * back;
  cam.position.set(c.x, c.y + dist * Math.sin(tilt), c.z + dist * Math.cos(tilt)); cam.lookAt(c);
  renderer.render(scene, cam);
  res(renderer.domElement.toDataURL('image/jpeg', .9));
  model.traverse(m => { if (m.isMesh) { m.geometry.dispose(); m.material.dispose(); } });
}, undefined, rej));
window.__ready = true;
</script></body></html>
